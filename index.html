<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoio ao Idoso</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 22px; /* Fonte maior para facilitar a leitura */
            line-height: 1.6;
            background-color: #f4f4f9;
            color: #111111; /* Alto contraste */
            margin: 0;
            padding: 20px;

        header {
            background-color: #0056b3;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }
        .botao {

            color: white;
            padding: 15px 30px;
            font-size: 24px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }
        section {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Central de Ajuda ao Idoso</h1>
    </header>

    <section>
        <h2>Como podemos ajudar hoje?</h2>
        <p>Este site foi feito para facilitar o seu dia a dia. Escolha uma das opções abaixo:</p>
        
        <ul>
            <li>Dicas de uso do celular e WhatsApp</li>
            <li>Lembretes de medicamentos</li>
            <li>Contatos de emergência e apoio</li>
        </ul>

        <a href="#" class="botao">Pedir Ajuda</a>
